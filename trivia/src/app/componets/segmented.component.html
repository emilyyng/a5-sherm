<div class="segmented" role="radiogroup" [attr.aria-labelledby]="labelledBy || null">
  @for (o of options; track o.value) {
    <label class="seg">
      <input
        type="radio"
        [name]="name"
        [checked]="o.value === selected()"
        [disabled]="disabled()"
        (change)="select(o.value)"
      />
      <span>{{ o.label }}</span>
    </label>
  }
</div>
