<div class="sparks" [class.color-only]="mode === 'color'" role="img" [attr.aria-label]="ariaLabel">
  @for (r of results; track $index) {
    <svg
      class="spark"
      [class.correct]="r === 'correct'"
      [class.wrong]="r === 'wrong'"
      [class.pending]="r === 'pending'"
      [class.animate]="animate"
      [style.--i]="$index"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      @if (r === 'pending') {
        <circle cx="12" cy="12" r="2.6" />
      } @else {
        <path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z" />
      }
    </svg>
  }
</div>
